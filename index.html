<script>
/* Portrait phones (iPhone with rotation lock, or inside an app that never rotates): run the game in a
   landscape-sized iframe rotated 90deg. Inside the iframe everything (layout, touch coords, media queries)
   behaves exactly like real landscape. The outer page does not boot its own game in this mode. */
(function () {
  var q = location.search || '';
  if (/[?&]embed=1/.test(q)) { window.__MONDO_EMBED = true; document.documentElement.classList.add('embed'); return; }
  var touch = false; try { touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { }
  if (!touch || innerHeight <= innerWidth) return;
  window.__MONDO_WRAP = true;
  var ROT_KEY = 'mondo_rot_flip';
  var flip = 0; try { flip = +localStorage.getItem(ROT_KEY) || 0; } catch (e) { }
  var css = document.createElement('style');
  css.textContent = 'html,body{margin:0;height:100%;overflow:hidden;background:#0b1422;overscroll-behavior:none;touch-action:none}' +
    '#game,#ui,#touch,#rotate{display:none!important}' +
    '#rw{position:fixed;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}' +
    '#rw iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#0b1422}';
  document.head.appendChild(css);
  var sep = q ? '&' : '?';
  function build() {
    var box = document.createElement('div'); box.id = 'rw';
    var f = document.createElement('iframe');
    f.src = location.pathname + q + sep + 'embed=1';
    f.setAttribute('allow', 'autoplay; fullscreen'); f.setAttribute('title', 'モンドの風跡');
    box.appendChild(f); document.body.appendChild(box);
    function lay() {
      var w = box.clientWidth, h = box.clientHeight;
      if (w >= h) { f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = 'none'; return; }
      f.style.width = h + 'px'; f.style.height = w + 'px';
      f.style.transform = flip ? 'translateY(' + h + 'px) rotate(-90deg)' : 'translateX(' + w + 'px) rotate(90deg)';
    }
    window.__mondoSetRot = function (v) { flip = v ? 1 : 0; try { localStorage.setItem(ROT_KEY, String(flip)); } catch (e) { } lay(); };
    window.__mondoGetRot = function () { return flip; };
    lay();
    addEventListener('resize', lay); addEventListener('orientationchange', function () { setTimeout(lay, 250); });
    if (window.visualViewport) visualViewport.addEventListener('resize', lay);
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
</script>
